[project]
name = "mceuchre"
version = "0.1.0"
description = "A Euchre engine and ReBeL-based self-play AI aiming for expert play."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["euchre", "rebel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks slow tests (search-heavy); run with -m slow",
]
